services:
  db:
    image: postgres:16-alpine
    container_name: texademia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: texademia_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - compiled_pdfs:/app/compiled_pdfs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal
      - web

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: rq worker latex_compile --url redis://redis:6379/0
    env_file:
      - ./backend/.env.production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - compiled_pdfs:/app/compiled_pdfs
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: texademia_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_static:/shared/static
    command: sh -c "rm -rf /shared/static/* && cp -r /app/dist/client/. /shared/static/ && node server-entry.mjs"
    networks:
      - internal
      - web

volumes:
  postgres_data:
  compiled_pdfs:
  frontend_static:
    name: texademia_frontend_static

networks:
  internal:
  web:
    external: true
